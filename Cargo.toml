[package]
name = "termbonsai"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "A bonsai that lives in your terminal: it grows while you keep it watered, wilts when you forget, follows the seasons, and fits in a tmux status line. Zero-dependency Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/termbonsai"
homepage = "https://github.com/printemps-tokyo/termbonsai"
readme = "README.md"
keywords = ["bonsai", "terminal", "tmux", "ascii-art", "pet"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "termbonsai"
path = "src/main.rs"

[lib]
name = "termbonsai"
path = "src/lib.rs"

[dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
